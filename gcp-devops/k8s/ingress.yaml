apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"

spec:
  rules:

  - http:
      paths:
      - path: /app
        pathType: Prefix
        backend:
          service:
            name: application-service
            port:
              number: 80

      - path: /patient
        pathType: Prefix
        backend:
          service:
            name: patient-service
            port:
              number: 80

      - path: /order
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 80