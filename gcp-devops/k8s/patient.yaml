apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
      - name: patient-service
        image: asia-south1-docker.pkg.dev/PLACEHOLDER_PROJECT_ID/devops/patient-service:latest
        ports:
        - containerPort: 8080 # Assuming standard Java/Spring port, change if different
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
spec:
  selector:
    app: patient-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
