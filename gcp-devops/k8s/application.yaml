apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: application-service
  template:
    metadata:
      labels:
        app: application-service
    spec:
      containers:
      - name: application-service
        image: asia-south1-docker.pkg.dev/$PROJECT_ID/devops/application-service
        ports:
        - containerPort: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: application-service
spec:
  selector:
    app: application-service
  ports:
  - port: 80
    targetPort: 3001
  type: ClusterIP