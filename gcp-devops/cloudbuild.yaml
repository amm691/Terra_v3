options:
  logging: CLOUD_LOGGING_ONLY

timeout: "60m"

steps:
# --- STEP 0: List files to ensure we have the right path ---
- name: 'ubuntu'
  args: ['ls', '-R']

steps:
# 1. Build & Push Application Service
- name: 'gcr.io/cloud-builders/docker'
  # NOTICE THE PATH: added 'gcp-devops' and 'src'
  dir: 'gcp-devops/apps/application-service/src' 
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/application-service', '.']

# 2. Build & Push Patient Service
- name: 'gcr.io/cloud-builders/docker'
  dir: 'gcp-devops/apps/patient-service' # Added 'gcp-devops'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/patient-service', '.']

# 3. Build & Push Order Service
- name: 'gcr.io/cloud-builders/docker'
  dir: 'gcp-devops/apps/order-service' # Added 'gcp-devops'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/order-service', '.']

# ... (Push steps stay the same) ...

# 4. Get cluster credentials
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - container
  - clusters
  - get-credentials
  - prod-gke
  - --zone
  - us-central1-a
  - --project
  - $PROJECT_ID

# 5. Deploy to cluster
- name: 'gcr.io/cloud-builders/kubectl'
  dir: 'gcp-devops' # Move into the folder where k8s/ exists
  args: ['apply', '-f', 'k8s/']
