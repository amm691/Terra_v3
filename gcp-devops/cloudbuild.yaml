options:
  logging: CLOUD_LOGGING_ONLY

timeout: "60m"

steps:
# --- DEBUG STEP: This will show us exactly where your files are ---
- name: 'ubuntu'
  args: ['find', '.', '-maxdepth', '3', '-not', '-path', '*/.*']

steps:
# 1. Build & Push Application Service
- name: 'gcr.io/cloud-builders/docker'
  dir: 'apps/application-service'  # Move into the folder first
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/application-service', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/application-service']

# 2. Build & Push Patient Service
- name: 'gcr.io/cloud-builders/docker'
  dir: 'apps/patient-service'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/patient-service', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/patient-service']

# 3. Build & Push Order Service
- name: 'gcr.io/cloud-builders/docker'
  dir: 'apps/order-service'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/order-service', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/order-service']

# 4. Get cluster credentials
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - container
  - clusters
  - get-credentials
  - prod-gke
  - --region
  - us-central1  # Verify if your cluster is in asia-south1 or us-central1!
  - --project
  - $PROJECT_ID

# 5. Deploy to cluster
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['apply', '-f', 'k8s/']
