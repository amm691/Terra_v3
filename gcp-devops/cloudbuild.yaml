options:
  logging: CLOUD_LOGGING_ONLY

timeout: "60m"

steps:
# --- STEP 0: List files to ensure we have the right path ---
- name: 'ubuntu'
  args: ['ls', '-R']

# --- STEP 1: Build & Push application-service ---
- name: 'gcr.io/cloud-builders/docker'
  dir: 'apps/application-service'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/application-service', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/application-service']

# --- STEP 2: Build & Push patient-service ---
- name: 'gcr.io/cloud-builders/docker'
  dir: 'apps/patient-service'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/patient-service', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/patient-service']

# --- STEP 3: Build & Push order-service ---
- name: 'gcr.io/cloud-builders/docker'
  dir: 'apps/order-service'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/order-service', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/order-service']

# --- STEP 4: Get cluster credentials (CORRECTED ZONE) ---
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - container
  - clusters
  - get-credentials
  - prod-gke
  - --zone
  - us-central1-a
  - --project
  - $PROJECT_ID

# --- STEP 5: Deploy to cluster ---
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['apply', '-f', 'k8s/']
