options:
  logging: CLOUD_LOGGING_ONLY

timeout: "60m"

steps:
# --- STEP 0: List files to ensure we have the right path ---
- name: 'ubuntu'
  args: ['ls', '-R']

steps:
# 1. Build & Push Application Service
- name: 'gcr.io/cloud-builders/docker'
  dir: 'gcp-devops/apps/application-service' # No more /src at the end
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/application-service', '.']
  
# 2. Build & Push Patient Service
- name: 'gcr.io/cloud-builders/docker'
  dir: 'gcp-devops/apps/patient-service' # Added 'gcp-devops'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/patient-service', '.']

# 3. Build & Push Order Service
- name: 'gcr.io/cloud-builders/docker'
  dir: 'gcp-devops/apps/order-service' # Added 'gcp-devops'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/devops/order-service', '.']


# ... (Build and Push steps remain the same) ...

# Step 4: Get cluster credentials
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - container
  - clusters
  - get-credentials
  - prod-gke
  - --zone
  - us-central1-a
  - --project
  - $PROJECT_ID

# Step 5: Replace Placeholder and Deploy All
- name: 'gcr.io/cloud-builders/kubectl'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    echo "Replacing PLACEHOLDER_PROJECT_ID with $PROJECT_ID in all YAMLs..."
    
    # This loop finds all yaml files and swaps the placeholder
    for file in gcp-devops/k8s/*.yaml; do
      sed -i "s/PLACEHOLDER_PROJECT_ID/$PROJECT_ID/g" "$file"
    done
    
    # Deploy the entire folder
    kubectl apply -f gcp-devops/k8s/
